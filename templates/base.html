<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FitBuddy AI fitness plan generator">
    <title>{% block title %}FitBuddy{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<div class="page-bg"></div>
<header class="navbar">
    <a class="brand" href="/"><img class="brand-logo" src="{{ url_for('static', path='images/fit.jpeg') }}" alt="FitBuddy logo"><span class="brand-name">Fit<span>Buddy</span></span></a>
    <nav><a href="/">Home</a><a href="/view-all-users">Dashboard</a></nav>
</header>
<main class="container">{% block content %}{% endblock %}</main>
<footer class="footer"><p>FitBuddy • AI-assisted fitness planning</p><p class="muted">General wellness guidance only — not medical advice.</p></footer>
<script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
